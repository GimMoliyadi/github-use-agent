name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MODEL_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Offline deterministic tests
        run: uv run --no-sync pytest -m "not live and not browser"
